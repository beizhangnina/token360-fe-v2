<svg viewBox="0 0 240 228" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D480EE"/><stop offset="40%" stop-color="#9633AF"/><stop offset="100%" stop-color="#7B28A0"/>
    </linearGradient>
    <radialGradient id="sat" cx="28%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#F5E0FF"/><stop offset="30%" stop-color="#E8B4F8"/><stop offset="60%" stop-color="#C96DDF"/><stop offset="100%" stop-color="#9633AF"/>
    </radialGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D480EE"/><stop offset="100%" stop-color="#9633AF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#D480EE" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(120,90) scale(0.75)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#9633AF" stroke-width="2.2" opacity="0.5"/>
    <circle cx="0" cy="0" r="56.6" fill="none" stroke="#9633AF" stroke-width="1.5" opacity="0.28"/>
    <g transform="rotate(-28)">
      <path d="M 73.6,-17.5 A 85,35 0 1,1 -29.1,-32.9" fill="none" stroke="url(#orb)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-18" cy="-34" r="3.5" fill="#B854D4" opacity="0.5"/>
      <circle cx="-3" cy="-35" r="2.5" fill="#9633AF" opacity="0.3"/>
      <circle cx="12" cy="-34.5" r="1.5" fill="#9633AF" opacity="0.15"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="900" fill="#FFFFFF">T</text>
    <circle cx="73.6" cy="-17.5" r="11" fill="url(#sat)" filter="url(#glow)" transform="rotate(-28)"/>
  </g>
  <text x="120" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="bold" letter-spacing="-1">
    <tspan fill="#FFFFFF">Token</tspan><tspan fill="url(#tg)">360</tspan>
  </text>
</svg>
