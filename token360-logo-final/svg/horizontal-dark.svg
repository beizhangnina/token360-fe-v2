<svg viewBox="0 0 580 140" xmlns="http://www.w3.org/2000/svg">
  <title>Token360 Horizontal (Dark)</title>
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D480EE"/><stop offset="40%" stop-color="#9633AF"/><stop offset="100%" stop-color="#7B28A0"/>
    </linearGradient>
    <radialGradient id="sat" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F0D0FF"/><stop offset="35%" stop-color="#D480EE"/><stop offset="100%" stop-color="#9633AF"/>
    </radialGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D480EE"/><stop offset="100%" stop-color="#9633AF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#D480EE" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Icon scaled to fit 140x140 area on the left -->
  <g transform="translate(100,70)">
    <g transform="rotate(-28)">
      <path d="M 73.6,-17.5 A 85,35 0 1,1 -29.1,-32.9" fill="none" stroke="url(#orb)" stroke-width="3.5" stroke-linecap="round" transform="translate(0,0)"/>
      <circle cx="-18" cy="-34" r="3.5" fill="#B854D4" opacity="0.5"/>
      <circle cx="-3" cy="-35" r="2.5" fill="#9633AF" opacity="0.33"/>
      <circle cx="12" cy="-34.5" r="1.8" fill="#9633AF" opacity="0.2"/>
      <circle cx="27" cy="-33" r="1.2" fill="#9633AF" opacity="0.1"/>
    </g>
    <text x="0" y="21" text-anchor="middle" font-family="Inter,-apple-system,Helvetica,sans-serif" font-size="84" font-weight="700" fill="#FFFFFF">T</text>
    <circle cx="73.6" cy="-17.5" r="11" fill="url(#sat)" filter="url(#glow)" transform="rotate(-28)"/>
  </g>
  <!-- Text on the right -->
  <text x="400" y="88" text-anchor="middle" font-family="Inter,-apple-system,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Token<tspan fill="url(#tg)">360</tspan></text>
</svg>
