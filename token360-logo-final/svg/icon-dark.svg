<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Token360 Icon (Dark)</title>
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D480EE"/><stop offset="40%" stop-color="#9633AF"/><stop offset="100%" stop-color="#7B28A0"/>
    </linearGradient>
    <radialGradient id="sat" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F0D0FF"/><stop offset="35%" stop-color="#D480EE"/><stop offset="100%" stop-color="#9633AF"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#D480EE" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="rotate(-28,100,100)">
    <path d="M 173.6,82.5 A 85,35 0 1,1 70.9,67.1" fill="none" stroke="url(#orb)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="82" cy="66" r="3.5" fill="#B854D4" opacity="0.5"/>
    <circle cx="97" cy="65" r="2.5" fill="#9633AF" opacity="0.33"/>
    <circle cx="112" cy="65.5" r="1.8" fill="#9633AF" opacity="0.2"/>
    <circle cx="127" cy="67" r="1.2" fill="#9633AF" opacity="0.1"/>
  </g>
  <text x="100" y="121" text-anchor="middle" font-family="Inter,-apple-system,Helvetica,sans-serif" font-size="84" font-weight="700" fill="#FFFFFF">T</text>
  <circle cx="173.6" cy="82.5" r="11" fill="url(#sat)" filter="url(#glow)" transform="rotate(-28,100,100)"/>
</svg>
